<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Alunos</title>
    <script>
        function EnviarAluno() {
            let matricula = document.getElementById("matricula").value;
            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;

            let erro = ValidaForm(matricula, nome, email);
            if (erro != "") {
                document.getElementById("msg").innerHTML = erro;
                return false;
            }

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    if (JSON.parse(this.responseText) == true) {
                        document.getElementById("msg").innerHTML = "Aluno inserido com sucesso!";
                        ListarAlunos();
                    } else {
                        document.getElementById("msg").innerHTML = "Erro ao inserir aluno!";
                    }
                }
            }
            xmlhttp.open("GET", "IncluirAluno.php?matricula=" + encodeURIComponent(matricula) + 
                            "&nome=" + encodeURIComponent(nome) + "&email=" + encodeURIComponent(email), true);
            xmlhttp.send();
        }

        function BuscarAluno() {
    let matricula = document.getElementById("matricula").value;

    if (matricula == "") {
        document.getElementById("msg").innerHTML = "Informe a matrícula para buscar.";
        return false;
    }

    let xmlhttp = new XMLHttpRequest();
    xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            let aluno = JSON.parse(this.responseText);
            if (aluno != null) {
                document.getElementById("nome").value = aluno.nome;
                document.getElementById("email").value = aluno.email;
                document.getElementById("msg").innerHTML = "Aluno encontrado!";
            } else {
                document.getElementById("nome").value = "";
                document.getElementById("email").value = "";
                document.getElementById("msg").innerHTML = "Aluno não encontrado!";
            }
        }
    }
    xmlhttp.open("GET", "BuscarAluno.php?matricula=" + encodeURIComponent(matricula), true);
    xmlhttp.send();
}


        function AlterarAluno() {
            let matricula = document.getElementById("matricula").value;
            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;

            let erro = ValidaForm(matricula, nome, email);
            if (erro != "") {
                document.getElementById("msg").innerHTML = erro;
                return false;
            }

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    if (JSON.parse(this.responseText) == true) {
                        document.getElementById("msg").innerHTML = "Aluno alterado com sucesso!";
                        ListarAlunos();
                    } else {
                        document.getElementById("msg").innerHTML = "Erro ao alterar aluno!";
                    }
                }
            }
            xmlhttp.open("GET", "AlterarAluno.php?matricula=" + encodeURIComponent(matricula) + 
                            "&nome=" + encodeURIComponent(nome) + "&email=" + encodeURIComponent(email), true);
            xmlhttp.send();
        }

        function ExcluirAluno() {
            let matricula = document.getElementById("matricula").value;

            if (matricula == "") {
                document.getElementById("msg").innerHTML = "Informe a matrícula para excluir.";
                return false;
            }

            if (!confirm("Tem certeza que deseja excluir o aluno de matrícula " + matricula + "?")) {
                return false;
            }

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    if (JSON.parse(this.responseText) == true) {
                        document.getElementById("msg").innerHTML = "Aluno excluído com sucesso!";
                        ListarAlunos();
                    } else {
                        document.getElementById("msg").innerHTML = "Erro ao excluir aluno!";
                    }
                }
            }
            xmlhttp.open("GET", "ExcluirAluno.php?matricula=" + encodeURIComponent(matricula), true);
            xmlhttp.send();
        }

        function ListarAlunos() {
            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    let dados = JSON.parse(this.responseText);
                    if (dados.length > 0) {
                        let html = "<h2>Lista de Alunos</h2><table border='1'><tr><th>Matrícula</th><th>Nome</th><th>Email</th></tr>";
                        for (let i = 0; i < dados.length; i++) {
                            html += "<tr><td>" + dados[i].matricula + "</td><td>" + dados[i].nome + "</td><td>" + dados[i].email + "</td></tr>";
                        }
                        html += "</table>";
                        document.getElementById("lista").innerHTML = html;
                    } else {
                        document.getElementById("lista").innerHTML = "<p>Nenhum aluno cadastrado no banco.</p>";
                    }
                }
            }
            xmlhttp.open("GET", "ListarAlunos.php", true);
            xmlhttp.send();
        }

        function ValidaForm(pmatricula, pnome, pemail) {
            let msg = "";
            if (pmatricula == "") msg += "Matrícula não preenchida.<br>";
            if (pnome == "") msg += "Nome não preenchido.<br>";
            if (pemail == "") msg += "Email não preenchido.<br>";
            return msg;
        }
    </script>
</head>
<body>
    <h1>Gerenciar Alunos</h1>
    <br>
    <form action="" method="POST" name="formAluno" id="formAluno">
        Matrícula: <input type="text" name="matricula" id="matricula" required> <br><br>
        Nome: <input type="text" name="nome" id="nome"> <br><br>
        Email: <input type="text" name="email" id="email"> <br><br>
        <br>
        <input type="button" value="Inserir" onclick="EnviarAluno();">
<input type="button" value="Buscar" onclick="BuscarAluno();">
<input type="button" value="Alterar" onclick="AlterarAluno();">
<input type="button" value="Deletar" onclick="ExcluirAluno();">
<input type="button" value="Listar" onclick="ListarAlunos();">

    </form>

    <p id="msg"></p>
    <hr>
    <div id="lista"></div>
</body>
</html>
